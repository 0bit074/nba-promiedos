<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e14" />
    <title>Sin conexión | The Rookie App</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
      }
      body {
        display: flex;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0e14;
        color: #eef2f7;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      img {
        border-radius: 22%;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
      }
      p {
        max-width: 22rem;
        margin: 0 0 24px;
        color: #8b98a9;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 8px;
        background: #f97316;
        color: #0a0e14;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" width="72" height="72" />
    <h1>Sin conexión</h1>
    <p>Necesitas internet para ver los marcadores. La página se recargará sola cuando vuelva la conexión.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
